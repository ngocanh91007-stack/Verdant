op:12px}.money-hero{background:linear-gradient(115deg,#183e32,#367b58);border-radius:16px;color:white;padding:23px;margin-bottom:16px}.money-hero .label{color:#c4d8ca;font-size:11px}.money-hero .amount{font:700 29px Manrope;margin:7px 0 14px}.money-split{display:flex;gap:25px;font-size:11px;color:#d7e6db}.money-split strong{display:block;color:white;margin-top:4px;font-size:14px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:12px 8px;border-bottom:1px solid #eff1eb;font-size:12px}.month-nav{display:flex;align-items:center;gap:10px;font-weight:600}.month-nav button{border:1px solid var(--line);background:white;border-radius:8px;width:28px;height:28px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.day-head{text-align:center;color:var(--muted);font-size:10px;padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day-cell{height:82px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:white}.day-cell.dim{background:#fafbf8;color:#b6bdb6}.cal-event{font-size:9px;background:#e5f0e4;color:#356a4d;padding:4px 5px;border-radius:5px;margin-top:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.cal-event.deadline{background:#f7eee0;color:#88713e}.week-list{display:grid}.week-row{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.week-date{color:var(--muted);font-size:11px}.modal-bg{position:fixed;inset:0;background:#11251db0;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fffefa;border-radius:17px;width:min(500px,100%);padding:23px;box-shadow:0 25px 80px #10281d44}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:18px;ma </style></head><body><div id="app"></div><script>
const KEY='verdant-v1',emptyDB={tasks:[],projects:[],transactions:[],goals:[],habits:[],notes:[],events:[]};let db;try{db={...emptyDB,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db={...emptyDB}}let page='Dashboard',filter='all',query='',month=new Date().toISOString().slice(0,7),calMode='month';const groups=[['OVERVIEW',['Dashboard','Calendar']],['PLAN',['Tasks','Projects']],['PERSONAL',['Finances','Goals & Habits','Notes']]],icons={Dashboard:'◫',Calendar:'▦',Tasks:'✓',Projects:'◇',Finances:'$', 'Goals & Habits':'✳',Notes:'▤'},today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/"/g,"&quot;").replace(/'/g,"&#39;"),fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'No date',money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0}).format(+n||0),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),empty=(a,b,i='✧')=>'<div class="empty"><i>'+i+'</i><strong>'+a+'</strong><span>'+b+'</span></div>',title=(a,b,act,label)=>'<div class="welcome"><div><h1 class="section-title">'+a+'</h1><p class="section-desc">'+b+'</p></div>'+(act?'<button class="btn" data-action="'+act+'"><span>＋</span> '+label+'</button>':'')+'</div>',taskRows=a=>a.map(t=>'<div class="row"><button class="check '+(t.done?'done':'')+'" data-action="toggle" data-id="'+t.id+'">'+(t.done?'✓':'')+'</button><div class="row-main"><strong style="'+(t.done?'text-decoration:line-through;color:#98a29a':'')+'">'+esc(t.title)+'</strong><small>'+fmtDate(t.date)+(t.project?' · '+esc(t.project):'')+'</small></div><span class="badge '+(t.priority||'low')+'">'+esc(t.priority||'low')+'</span><button class="text-btn" data-action="edit" data-kind="task" data-id="'+t.id+'">Edit</button></div>').join('');
function dashboard(){let pending=db.tasks.filter(t=>!t.done),due=pending.filter(t=>t.date===today()),ev=[...db.events,...pending.filter(t=>t.date).map(t=>({...t,type:'deadline'}))].filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4),tx=db.transactions.filter(t=>t.date?.startsWith(today().slice(0,7))),inc=tx.filter(t=>t.type==='income').reduce((s,t)=>s+ +t.amount,0),spent=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+ +t.amount,0);return '<div class="welcome"><div><div class="eyebrow">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+' · YOUR SPACE</div><h1>Good day, Ngọc Anh <span>✳</span></h1><p>A little clarity for whatever today brings.</p></div><button class="btn" data-action="add-task"><span>＋</span> Add a task</button></div><div class="stats">'+[['Open tasks',pending.length,due.length+' due today','✓'],['Active projects',db.projects.filter(p=>p.status!=='Done').length,'Across your workspace','◇'],['Net this month',money(inc-spent),'Income minus expenses','↗'],['Goals in motion',db.goals.filter(g=>(+g.progress||0)<100&&g.type!=='savings').length,'Keep moving at your pace','✳']].map(x=>'<div class="stat"><div class="stat-top"><span>'+x[0]+'</span><span class="stat-icon">'+x[3]+'</span></div><div class="stat-num">'+x[1]+'</div><div class="stat-foot">'+x[2]+'</div></div>').join('')+'</div><div class="dash-grid"><section><div class="card"><div class="card-head"><h2>Today’s priorities</h2><button class="btn ghost small" data-nav="Tasks">View all →</button></div>'+(pending.filter(t=>!t.date||t.date<=today()).length?'<div class="list">'+taskRows(pending.filter(t=>!t.date||t.date<=today()).slice(0,4))+'</div>':empty('A clear page','Add a task when something needs your attention.','✓'))+'</div><div class="card"><div class="card-head"><h2>Projects</h2><button class="btn ghost small" data-nav="Projects">All projects →</button></div>'+(db.projects.length?'<div class="list">'+db.projects.slice(0,3).map(p=>'<div class="row"><div class="stat-icon">◇</div><div class="row-main"><strong>'+esc(p.name)+'</strong><small>'+esc(p.status||'In progress')+' · '+(+p.progress||0)+'% complete</small></div><div class="progress"><i style="width:'+Math.min(100,+p.progress||0)+'%"></i></div></div>').join('')+'</div>':empty('Nothing underway yet','Create a project to give an idea its own space.','◇'))+'</div></section><section><div class="card"><div class="card-head"><h2>Coming up</h2><button class="btn ghost small" data-nav="Calendar">Calendar →</button></div>'+(ev.length?'<div class="list">'+ev.map(e=>'<div class="row"><div class="stat-icon">'+(e.type==='deadline'?'◷':'▦')+'</div><div class="row-main"><strong>'+esc(e.title)+'</strong><small>'+fmtDate(e.date)+(e.type==='deadline'?' · Deadline':' · Event')+'</small></div></div>').join('')+'</div>':empty('Nothing on the horizon','Events and deadlines will show up here.','▦'))+'</div><div class="card"><div class="card-head"><h2>Gentle reminders</h2><span class="subtle">Your rhythm</span></div>'+(db.habits.length?'<div class="list">'+db.habits.slice(0,4).map(h=>'<div class="row"><button class="check '+(h.last===today()?'done':'')+'" data-action="habit" data-id="'+h.id+'">'+(h.last===today()?'✓':'')+'</button><div class="row-main"><strong>'+esc(h.name)+'</strong><small>'+(h.last===today()?'Done today':'A small step today')+'</small></div></div>').join('')+'</div>':empty('Make room for a ritual','Add habits you want to make part of your day.','✳'))+'</div></section></div>'}
function tasksPage(){let a=db.tasks.filter(t=>filter==='all'||filter==='open'&&!t.done||filter==='done'&&t.done).filter(t=>!query||t.title.toLowerCase().includes(query.toLowerCase()));return title('Tasks','Keep the next right thing in view.','add-task','New task')+'<div class="toolbar"><input class="search" id="search" placeholder="Search tasks…" value="'+esc(query)+'"><div class="tabs">'+[['all','All'],['open','Open'],['done','Completed']].map(x=>'<button data-filter="'+x[0]+'" class="'+(filter===x[0]?'active':'')+'">'+x[1]+'</button>').join('')+'</div></div><div class="card">'+(a.length?'<div class="list">'+taskRows(a)+'</div>':empty(query?'No matching tasks':'No tasks here yet',query?'Try another search.':'Add a task to navigate your day.','✓'))+'</div>'}
function projectsPage(){return title('Projects','Give your personal plans room to take shape.','add-project','New project')+(db.projects.length?'<div class="project-grid">'+db.projects.map(p=>'<article class="project-card"><div class="card-head"><span class="badge">'+esc(p.status||'In progress')+'</span><span><button class="text-btn" data-action="edit" data-kind="project" data-id="'+p.id+'">Edit</button><button class="text-btn delete" data-action="delete" data-kind="project" data-id="'+p.id+'">×</button></span></div><h3>'+esc(p.name)+'</h3><p>'+esc(p.notes||'No notes yet.')+'</p><div class="progress"><i style="width:'+Math.min(100,+p.progress||0)+'%"></i></div><div class="project-meta"><span>'+(+p.progress||0)+'% complete</span><span>'+fmtDate(p.date)+'</span></div></article>').join('')+'</div>':empty('Your next idea can start here','Create a project to collect milestones, notes and dates.','◇'))}
function financesPage(){let tx=db.transactions.filter(t=>t.date?.startsWith(month)),spent=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+ +t.amount,0),inc=tx.filter(t=>t.type==='income').reduce((s,t)=>s+ +t.amount,0),saves=db.goals.filter(g=>g.type==='savings');return title('Finances','A clear view of what comes in and where it goes.','add-transaction','Add transaction')+'<div class="money-hero"><div class="label">Net this month</div><div class="amount">'+money(inc-spent)+'</div><div class="money-split"><span>Income<strong>'+money(inc)+'</strong></span><span>Expenses<strong>'+money(spent)+'</strong></span></div></div><div class="card"><div class="card-head"><div class="month-nav"><button data-action="month-prev">‹</button><span>'+new Date(month+'-02').toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</span><button data-action="month-next">›</button></div><button class="btn light small" data-action="add-savings">＋ Savings goal</button></div>'+(saves.length?'<div class="goal-grid" style="margin-bottom:18px">'+saves.map(g=>'<div class="goal-card"><h3>'+esc(g.name)+'</h3><p>'+money(g.saved||0)+' saved of '+money(g.target)+'</p><div class="progress"><i style="width:'+Math.min(100,(g.saved/g.target*100)||0)+'%"></i></div><button class="text-btn" data-action="edit" data-kind="savings" data-id="'+g.id+'">Edit</button></div>').join('')+'</div>':'')+(tx.length?'<table class="table"><thead><tr><th>Transaction</th><th>Category</th><th>Date</th><th>Amount</th><th></th></tr></thead><tbody>'+tx.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.category)+'</td><td>'+fmtDate(t.date)+'</td><td>'+(t.type==='income'?'+':'−')+money(t.amount)+'</td><td><button class="text-btn" data-action="edit" data-kind="transaction" data-id="'+t.id+'">Edit</button><button class="text-btn delete" data-action="delete" data-kind="transaction" data-id="'+t.id+'">×</button></td></tr>').join('')+'</tbody></table>':empty('No transactions for this month','Add income or an expense to start your monthly summary.','$'))+'</div>'}
function goalsPage(){let gs=db.goals.filter(g=>g.type!=='savings');return title('Goals & habits','Build a life that feels like yours, one small step at a time.','add-goal','New goal')+'<div class="card"><div class="card-head"><h2>Goals</h2><span class="subtle">'+gs.length+' goals</span></div>'+(gs.length?'<div class="goal-grid">'+gs.map(g=>'<div class="goal-card"><div class="card-head"><span class="badge">'+esc(g.horizon||'Ongoing')+'</span><button class="text-btn" data-action="edit" data-kind="goal" data-id="'+g.id+'">Edit</button></div><h3>'+esc(g.name)+'</h3><p>'+esc(g.notes||'Keep making progress at your own pace.')+'</p><div class="progress"><i style="width:'+Math.min(100,+g.progress||0)+'%"></i></div><div class="project-meta"><span>'+(+g.progress||0)+'% complete</span><span>'+fmtDate(g.date)+'</span></div></div>').join('')+'</div>':empty('Choose something that matters','Add a goal to see your progress grow.','✳'))+'</div><div class="card"><div class="card-head"><h2>Daily habits</h2><button class="btn light small" data-action="add-habit">＋ Add habit</button></div>'+(db.habits.length?'<div class="list">'+db.habits.map(h=>'<div class="row"><button class="check '+(h.last===today()?'done':'')+'" data-action="habit" data-id="'+h.id+'">'+(h.last===today()?'✓':'')+'</button><div class="row-main"><strong>'+esc(h.name)+'</strong><small>'+(h.last===today()?'Completed today':'Not checked off today')+'</small></div><button class="text-btn" data-action="delete" data-kind="habit" data-id="'+h.id+'">Remove</button></div>').join('')+'</div>':empty('No habits added','Add a gentle daily practice you want to remember.','↻'))+'</div>'}
function notesPage(){let a=db.notes.filter(n=>!query||(n.title+' '+n.body+' '+n.category).toLowerCase().includes(query.toLowerCase()));return title('Notes & ideas','A home for the useful things you want to remember.','add-note','New note')+'<div class="toolbar"><input class="search" id="search" placeholder="Search your notes…" value="'+esc(query)+'"></div>'+(a.length?'<div class="note-grid">'+a.map(n=>'<article class="note-card"><div class="card-head"><span class="badge">'+esc(n.category||'Unsorted')+'</span><span><button class="text-btn" data-action="edit" data-kind="note" data-id="'+n.id+'">Edit</button><button class="text-btn delete" data-action="delete" data-kind="note" data-id="'+n.id+'">×</button></span></div><h3>'+esc(n.title)+'</h3><p>'+esc(n.body)+'</p><div class="project-meta"><span>Saved note</span><span>'+fmtDate(n.updated||today())+'</span></div></article>').join('')+'</div>':empty(query?'No notes found':'A thought worth keeping?','Save notes, ideas and reference details here.','▤'))}
function calendarPage(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),start=(first.getDay()+6)%7,days=new Date(y,m,0).getDate(),count=Math.ceil((start+days)/7)*7,prev=new Date(y,m-1,0).getDate(),entries=[...db.events.map(e=>({...e,type:'event'})),...db.tasks.filter(t=>t.date).map(t=>({...t,type:'deadline'}))],grid=Array.from({length:count},(_,i)=>{let n=i-start+1,a=n<1?prev+n:n>days?n-days:n,mo=m-1+(n<1?-1:n>days?1:0),yr=y+(mo<0?-1:mo>11?1:0),key=yr+'-'+String((mo+12)%12+1).padStart(2,'0')+'-'+String(a).padStart(2,'0'),ls=entries.filter(e=>e.date===key);return '<div class="day-cell '+(n<1||n>days?'dim':'')+'"><div>'+a+'</div>'+ls.slice(0,2).map(e=>'<div class="cal-event '+(e.type==='deadline'?'deadline':'')+'">'+esc(e.title)+'</div>').join('')+'</div>'}).join(''),view=calMode==='month'?'<div class="calendar">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="day-head">'+x+'</div>').join('')+grid+'</div>':'<div class="week-list">'+Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+i);let key=d.toISOString().slice(0,10),es=entries.filter(e=>e.date===key);return '<div class="week-row"><div class="week-date">'+d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</div><div>'+(es.length?es.map(e=>'<div class="row-main"><strong>'+esc(e.title)+'</strong><small>'+(e.type==='deadline'?'Deadline':'Event')+'</small></div>').join(''):'<span class="subtle">Nothing scheduled</span>')+'</div></div>'}).join('')+'</div>';return title('Calendar','Events, reminders and deadlines in one calm view.','add-event','Add event')+'<div class="card"><div class="card-head"><div class="month-nav"><button data-action="cal-prev">‹</button><span>'+first.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</span><button data-action="cal-next">›</button></div><div class="tabs"><button data-cal="month" class="'+(calMode==='month'?'active':'')+'">Month</button><button data-cal="week" class="'+(calMode==='week'?'active':'')+'">Week</button></div></div>'+view+'</div><div class="card"><div class="card-head"><h2>Events</h2></div>'+(db.events.length?'<div class="list">'+db.events.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>'<div class="row"><div class="stat-icon">▦</div><div class="row-main"><strong>'+esc(e.title)+'</strong><small>'+fmtDate(e.date)+(e.time?' · '+esc(e.time):'')+'</small></div><button class="text-btn" data-action="edit" data-kind="event" data-id="'+e.id+'">Edit</button><button class="text-btn delete" data-action="delete" data-kind="event" data-id="'+e.id+'">×</button></div>').join('')+'</div>':empty('Your calendar is open','Add an event or give a task a deadline to see it here.','▦'))+'</div>'}
function render(){let app=document.getElementById('app');app.innerHTML='<div class="shell '+(document.body.classList.contains('menu-open')?'menu-open':'')+'"><aside><div class="brand"><span class="mark">✳</span> VERDANT</div><div class="brand-sub">Your life, in good order</div>'+groups.map(([g,its])=>'<div class="nav-label">'+g+'</div><nav class="nav">'+its.map(x=>'<button data-nav="'+x+'" class="'+(page===x?'active':'')+'"><span>'+icons[x]+'</span>'+x+'</button>').join('')+'</nav>').join('')+'<div class="side-bottom"><div class="avatar">NA</div><div><strong>Nguyễn Trần Ngọc Anh</strong><small>Personal workspace</small></div></div></aside><main class="main"><header class="topbar"><div><button class="icon-btn mobile-menu" data-action="menu">☰</button> <span class="crumb">Workspace　/　'+page+'</span></div><div><span class="today-chip">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'　</span><button class="icon-btn" title="Search notes" data-action="global-search">⌕</button></div></header><div class="content">'+({Dashboard:dashboard,Tasks:tasksPage,Projects:projectsPage,Finances:financesPage,'Goals & Habits':goalsPage,Notes:notesPage,Calendar:calendarPage}[page]())+'</div></main></div>';bind()}
const schemas={task:[['title','Task','text',1],['date','Due date','date'],['priority','Priority','select',['low','medium','high']],['project','Project','text'],['notes','Notes','textarea']],project:[['name','Project name','text',1],['status','Status','select',['In progress','On hold','Done']],['progress','Progress (%)','number'],['date','Deadline','date'],['notes','Notes','textarea']],transaction:[['name','Description','text',1],['type','Type','select',['expense','income']],['amount','Amount','number',1],['category','Category','text'],['date','Date','date',1]],goal:[['name','Goal','text',1],['horizon','Timeframe','select',['Short-term','Long-term','Ongoing']],['progress','Progress (%)','number'],['date','Target date','date'],['notes','Notes','textarea']],savings:[['name','Savings goal','text',1],['target','Target amount','number',1],['saved','Already saved','number'],['date','Target date','date']],habit:[['name','Habit','text',1]],note:[['title','Title','text',1],['category','Category','text'],['body','Content','textarea',1]],event:[['title','Event','text',1],['date','Date','date',1],['time','Time','time'],['notes','Notes','textarea']]},coll={task:'tasks',project:'projects',transaction:'transactions',goal:'goals',savings:'goals',habit:'habits',note:'notes',event:'events'};
function form(kind,id){
 const arr=db[coll[kind]], old=id?arr.find(x=>x.id===id):{}, fields=schemas[kind].map(([key,label,type,extra])=>{
  const val=old[key]??(key==='date'&&(kind==='event'||kind==='transaction')?today():key==='priority'?'medium':key==='progress'?0:key==='type'?'expense':'');
  let input;
  if(type==='select') input='<select name="'+key+'">'+extra.map(x=>'<option '+(val===x?'selected':'')+'>'+x+'</option>').join('')+'</select>';
  else if(type==='textarea') input='<textarea name="'+key+'" '+(extra===1?'required':'')+'>'+esc(val)+'</textarea>';
  else input='<input name="'+key+'" type="'+type+'" value="'+esc(val)+'" '+(extra===1?'required':'')+'>';
  return '<div class="field '+(type==='textarea'?'full':'')+'"><label>'+label+'</label>'+input+'</div>';
 }).join('');
 document.body.insertAdjacentHTML('beforeend','<div class="modal-bg"><form class="modal" id="entry"><div class="modal-head"><h2>'+(id?'Edit ':'New ')+kind+'</h2><button type="button" class="x-btn" data-action="close">×</button></div><div class="form">'+fields+'</div><div class="modal-actions"><button class="btn light" type="button" data-action="close">Cancel</button><button class="btn">Save</button></div></form></div>');
 const f=document.getElementById('entry');
 f.onsubmit=e=>{
  e.preventDefault();
  const item=Object.fromEntries(new FormData(f));
  ['progress','amount','target','saved'].forEach(k=>{if(item[k]!==undefined)item[k]=Number(item[k])||0});
  if(id) Object.assign(old,item); else arr.unshift({id:crypto.randomUUID(),...item,...(kind==='note'?{updated:today()}:{}),...(kind==='task'?{done:false}:{})});
  save();document.querySelector('.modal-bg').remove();render();toast('Saved');
 };
}function toast(s){let x=document.createElement('div');x.className='toast';x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),1800)}function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;query='';document.body.classList.remove('menu-open');render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>{let a=b.dataset.action,id=b.dataset.id,k=b.dataset.kind;if(a==='menu'){document.body.classList.toggle('menu-open');document.querySelector('.shell').classList.toggle('menu-open')}else if(a==='close')document.querySelector('.modal-bg')?.remove();else if(a==='global-search'){page='Notes';render();document.getElementById('search')?.focus()}else if(a==='add-task')form('task');else if(a==='add-project')form('project');else if(a==='add-transaction')form('transaction');else if(a==='add-goal')form('goal');else if(a==='add-savings')form('savings');else if(a==='add-habit')form('habit');else if(a==='add-note')form('note');else if(a==='add-event')form('event');else if(a==='edit')form(k,id);else if(a==='delete'){if(confirm('Delete this item?')){db[coll[k]]=db[coll[k]].filter(x=>x.id!==id);save();render();toast('Deleted')}}else if(a==='toggle'){let t=db.tasks.find(x=>x.id===id);t.done=!t.done;save();render()}else if(a==='habit'){let h=db.habits.find(x=>x.id===id);h.last=h.last===today()?'':today();save();render()}else if(a==='month-prev'||a==='month-next'||a==='cal-prev'||a==='cal-next'){let d=new Date(month+'-02');d.setMonth(d.getMonth()+((a.endsWith('prev'))?-1:1));month=d.toISOString().slice(0,7);render()}});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{calMode=b.dataset.cal;render()});let s=document.getElementById('search');if(s)s.oninput=()=>{query=s.value;let p=s.selectionStart,y=scrollY;render();let n=document.getElementById('search');n.focus();n.setSelectionRange(p,p);scrollTo(0,y)}}render();
</script></body></html>
